name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact normalized commit to build
        type: string
        default: ''
      release_call:
        description: Release caller performs mandatory 4D acceptance separately
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.configuration.outputs.matrix }}
      initialized: ${{ steps.configuration.outputs.initialized }}
      language: ${{ steps.configuration.outputs.language }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated reference icons
        run: python scripts/generate_icons.py --check
      - name: Static and initializer tests (no CLI toolchains)
        env:
          TEST_CLI_LANGUAGE: none
        run: python -m unittest discover -s tests -v
      - name: Read configured native matrix
        id: configuration
        run: python scripts/ci_config.py matrix

  native:
    needs: configuration
    if: needs.configuration.outputs.initialized == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configuration.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TEST_CLI_LANGUAGE: ${{ matrix.language }}
      CLI_TARGET: ${{ matrix.target }}
      CLI_LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.26.10'
          cache: false
      - name: Set up Rust 1.99.1 only when selected
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Select Rust 1.99.1
        if: matrix.language == 'rust'
        run: rustup default 1.99.1
      - name: Native Windows and macOS feature tests and pure-helper tests
        run: python -m unittest discover -s tests -p test_cli.py -v
      - name: Native build and protocol smoke tests
        run: python scripts/build_cli.py --target "$CLI_TARGET" --language "$CLI_LANGUAGE"
        shell: bash
      - name: Verify native Windows system imports and actual retail static MSVC runtime
        if: matrix.target == 'windows-x64' && matrix.language == 'cpp'
        run: python scripts/check_windows_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/*
            !build/${{ matrix.target }}/cargo/**
            !build/${{ matrix.target }}/cmake/**
          if-no-files-found: error
          retention-days: 7

  assembly:
    needs: [configuration, native]
    if: needs.configuration.outputs.initialized == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: build
          merge-multiple: false
      - name: Move native artifacts into per-target build directories
        run: |
          for target in macos-x64 macos-arm64 windows-x64; do
            mkdir -p "build/$target"
            cp -R "build/cli-$target/." "build/$target/"
          done
      - name: Assemble universal macOS and Windows x64 resources with same-source native manifests
        id: assemble
        run: python scripts/ci_config.py assemble
      - uses: actions/upload-artifact@v4
        with:
          name: component-resources
          path: ${{ steps.assemble.outputs.resources }}
          if-no-files-found: error
          retention-days: 7

  macos-host:
    needs: [configuration, native]
    if: needs.configuration.outputs.initialized == 'true' && vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
    runs-on: macos-15
    env:
      TOOL4D_URL: ${{ vars.TOOL4D_URL }}
      TOOL4D_SHA256: ${{ vars.TOOL4D_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: build
      - name: Move native artifacts into per-target build directories
        run: |
          for target in macos-x64 macos-arm64 windows-x64; do
            mkdir -p "build/$target"
            cp -R "build/cli-$target/." "build/$target/"
          done
      - name: Download pinned free native macOS ARM64 tool4D
        run: python scripts/ci_config.py download-tool4d
      - name: Assemble, source host, both-target compile, package and final compiled-ZIP host on macOS 4D
        run: >-
          python scripts/accept_hosted.py --repository "$GITHUB_REPOSITORY"
          --tool4d .tools/tool4d.app/Contents/MacOS/tool4d
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-component
          path: |
            dist/*.zip
            dist/*.acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain source, compiler and final-host diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-acceptance-diagnostics
          path: |
            build/hosted-acceptance.json
            build/source-host-status.json
            build/compile-status.json
            build/compiled-host-status.json
            build/host-status.json
          if-no-files-found: warn
          retention-days: 30

  windows-host:
    needs: [configuration, macos-host]
    if: needs.configuration.outputs.initialized == 'true' && vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      TOOL4D_URL: ${{ vars.TOOL4D_URL }}
      TOOL4D_SHA256: ${{ vars.TOOL4D_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: compiled-component
          path: dist
      - name: Download pinned free native Windows x64 tool4D
        run: python scripts/ci_config.py download-tool4d
      - name: Load the macOS-compiled ZIP in a real native Windows 4D host
        run: >-
          python scripts/accept_package.py --repository "$GITHUB_REPOSITORY"
          --zip dist/DisplayScale.zip --tool4d .tools/tool4d/tool4d.exe
      - name: Retain Windows host diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-host
          path: |
            build/package-host-windows-x64.json
            build/host-status.json
          if-no-files-found: warn
          retention-days: 30
