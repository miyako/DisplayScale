name: Publish
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Semantic version increment
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require manual publication from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Publish must be run on main." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute prefix-free release tag from stable history (including legacy v tags)
        id: version
        env:
          MODE: ${{ inputs.mode }}
        run: python scripts/bump_release.py next --mode "$MODE"
      - name: Synchronize version metadata and stage only validated version changes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/bump_release.py apply --version "$VERSION" --stage
      - name: Require hosted 4D opt-in and the pinned macOS ARM64 and native Windows x64 tool4d
        env:
          FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/ci_config.py validate --release --tag "$RELEASE_TAG"
      - name: Reject existing release tags or GitHub releases before committing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/release_ref.py available --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Require Apple Developer ID signing and notarization for every release
        run: python scripts/sign_release.py policy --root . --require-apple-signing
      - name: Commit version updates to main and record the exact build SHA
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release $VERSION"
            git push origin HEAD:refs/heads/main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.version.outputs.source_sha }}
      release_call: true

  compile:
    needs: [version, native]
    runs-on: macos-15
    env:
      FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
      TOOL4D_URL: ${{ vars.TOOL4D_URL }}
      TOOL4D_SHA256: ${{ vars.TOOL4D_SHA256 }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci_config.py validate --release --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: build
      - name: Move native artifacts into per-target build directories
        run: |
          for target in macos-x64 macos-arm64 windows-x64; do
            mkdir -p "build/$target"
            cp -R "build/cli-$target/." "build/$target/"
          done
      - name: Download SHA-256-verified native macOS ARM64 tool4D
        run: python scripts/ci_config.py download-tool4d
      - name: Source host, both-target compile, package, sign, notarize and final ZIP host on macOS 4D
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          CODESIGN_APPLE_ID: ${{ secrets.CODESIGN_APPLE_ID }}
        run: >-
          python scripts/accept_hosted.py --repository "$GITHUB_REPOSITORY"
          --tool4d .tools/tool4d.app/Contents/MacOS/tool4d
          --tag "$RELEASE_TAG" --require-apple-signing
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*-signing.json
            dist/*.acceptance.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain source, compiler and final-host diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-diagnostics
          path: |
            build/hosted-acceptance.json
            build/source-host-status.json
            build/compile-status.json
            build/unsigned-compiled-host-status.json
            build/compiled-host-status.json
            build/host-status.json
          if-no-files-found: warn
          retention-days: 30

  windows-host:
    needs: [version, compile]
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
      TOOL4D_URL: ${{ vars.TOOL4D_URL }}
      TOOL4D_SHA256: ${{ vars.TOOL4D_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: compiled-release
          path: dist
      - name: Download SHA-256-verified native Windows x64 tool4D
        run: python scripts/ci_config.py download-tool4d
      - name: Load the exact signed final ZIP in a real native Windows 4D host
        run: >-
          python scripts/accept_package.py --repository "$GITHUB_REPOSITORY"
          --zip dist/DisplayScale.zip --tool4d .tools/tool4d/tool4d.exe
      - name: Retain Windows host diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-host
          path: |
            build/package-host-windows-x64.json
            build/host-status.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [version, compile, windows-host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: compiled-release
          path: dist
      - name: Create the tag and release only after final asset validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.version.outputs.source_sha }}
        run: |
          python scripts/release_assets.py --repository "$GH_REPO" --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" --require-apple-signing --create-tag --publish
